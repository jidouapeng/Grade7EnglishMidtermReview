<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>七年级英语上册 期中复习计划（Starter Unit 1 ~ Unit 3）</title>
<style>
:root{
  --bg:#eef2f9;
  --card:#fff;
  --ink:#1e2a44;
  --ink2:#43506e;
  --muted:#7a86a4;
  --line:#e6eaf3;
  --brand:#4f7cff;
  --brand-d:#3358d4;
  --brand-l:#eaf0ff;
  --accent:#ff8a4c;
  --ok:#16b26a;
  --ok-l:#e6f8ef;
  --bad:#ef4d5a;
  --bad-l:#ffecee;
  --gold:#f5b93a;
  --purple:#8b5cf6;
  --radius:18px;
  --shadow:0 6px 22px rgba(30,42,68,.07);
  --shadow-lg:0 14px 40px rgba(30,42,68,.13);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,Segoe UI,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(1200px 600px at 12% -10%, #dfe8ff 0%, rgba(223,232,255,0) 60%),
    radial-gradient(900px 500px at 100% 0%, #ffe9dc 0%, rgba(255,233,220,0) 55%),
    var(--bg);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  line-height:1.6;
}
.app{max-width:1100px;margin:0 auto;padding:16px 16px 80px}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  backdrop-filter:blur(10px);
  background:rgba(255,255,255,.82);
  border-bottom:1px solid var(--line);
  padding:10px 0 0;
}
.topbar-in{max-width:1100px;margin:0 auto;padding:0 16px}
.brand-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{
  width:42px;height:42px;border-radius:13px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--brand),#7a5cf6);
  color:#fff;font-weight:800;font-size:19px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 16px rgba(79,124,255,.32);
}
.brand-txt h1{font-size:17px;margin:0;font-weight:800;letter-spacing:.2px}
.brand-txt p{margin:0;font-size:12.5px;color:var(--muted)}
.head-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--brand-l);color:var(--brand-d);
  border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:700;
}
.pill.gold{background:#fff4dc;color:#a06d00}
.pill.green{background:var(--ok-l);color:#0d7d47}
.pill.red{background:var(--bad-l);color:#b32834}
.pill.gray{background:#f0f2f7;color:var(--ink2)}
.mini-bar{height:6px;background:#eceff6;border-radius:99px;overflow:hidden;margin-top:9px}
.mini-bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#7a5cf6);border-radius:99px;transition:width .5s}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  border:0;background:transparent;cursor:pointer;
  padding:11px 16px;font-size:14.5px;font-weight:700;color:var(--muted);
  border-bottom:3px solid transparent;white-space:nowrap;font-family:inherit;
}
.tab.on{color:var(--brand-d);border-bottom-color:var(--brand)}
.tab .badge{
  background:#eceff6;color:var(--ink2);border-radius:99px;
  font-size:11px;padding:1px 7px;margin-left:5px;font-weight:800;
}
.tab.on .badge{background:var(--brand);color:#fff}

/* ---------- layout ---------- */
.view{display:none;padding-top:18px;animation:fade .25s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
.card h2{font-size:16px;margin:0 0 4px;font-weight:800;display:flex;align-items:center;gap:8px}
.card .sub{font-size:13px;color:var(--muted);margin:0 0 14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:820px){.g2,.g3{grid-template-columns:1fr}}

/* ---------- dashboard ---------- */
.dash{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
@media(max-width:640px){.dash{grid-template-columns:1fr;text-align:center}}
.ring{position:relative;width:132px;height:132px;flex:0 0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .mid b{font-size:30px;line-height:1;font-weight:800}
.ring .mid span{font-size:12px;color:var(--muted);margin-top:3px}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px;margin-top:14px}
.stat{background:#f7f9fd;border:1px solid var(--line);border-radius:14px;padding:11px 13px}
.stat b{display:block;font-size:21px;font-weight:800;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}

/* ---------- buttons ---------- */
.btn{
  font-family:inherit;border:0;cursor:pointer;border-radius:12px;
  padding:10px 16px;font-size:14px;font-weight:700;color:var(--ink2);
  background:#f1f4f9;transition:.15s;display:inline-flex;align-items:center;gap:7px;
}
.btn:hover{background:#e7ecf5;transform:translateY(-1px)}
.btn:active{transform:none}
.btn.primary{background:var(--brand);color:#fff;box-shadow:0 6px 16px rgba(79,124,255,.3)}
.btn.primary:hover{background:var(--brand-d)}
.btn.accent{background:var(--accent);color:#fff;box-shadow:0 6px 16px rgba(255,138,76,.3)}
.btn.ok{background:var(--ok);color:#fff;box-shadow:0 6px 16px rgba(22,178,106,.28)}
.btn.ghost{background:#fff;border:1.5px solid var(--line)}
.btn.big{padding:13px 22px;font-size:15.5px;border-radius:14px}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}

/* ---------- chips ---------- */
.chip{
  display:inline-flex;align-items:center;gap:5px;
  border-radius:8px;padding:3px 9px;font-size:11.5px;font-weight:700;
  background:#f1f4f9;color:var(--ink2);
}
.chip.u{background:var(--brand-l);color:var(--brand-d)}
.chip.c{background:#f2ecff;color:#6d3fd1}
.chip.r{background:#fff4dc;color:#a06d00}
.chip.g{background:var(--ok-l);color:#0d7d47}

/* ---------- day plan ---------- */
.day{border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:10px;background:#fcfdff}
.day.done{background:var(--ok-l);border-color:#bfe9d4}
.day .dtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.day .dname{font-weight:800;font-size:15px}
.day .dtip{font-size:12.5px;color:var(--muted);margin:6px 0 8px;line-height:1.55}
.day .dacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.unit-pills{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- matrix ---------- */
.tbl-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:720px}
th,td{padding:9px 10px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:#f7f9fd;font-weight:800;color:var(--ink2);font-size:12.5px}
th:first-child,td:first-child{text-align:left;font-weight:700;position:sticky;left:0;background:#fff;z-index:1}
thead th:first-child{background:#f7f9fd}
tbody tr:hover td{background:#fbfcff}
tbody tr:hover td:first-child{background:#fbfcff}
td.cell{cursor:pointer;user-select:none;transition:.15s}
td.cell:hover{background:var(--brand-l)!important;outline:1.5px dashed var(--brand);outline-offset:-2px}
td .cnt{display:block;font-size:11px;color:var(--muted)}
.bar-mini{height:5px;border-radius:99px;background:#eceff6;overflow:hidden;margin-top:4px;width:56px;margin-inline:auto}
.bar-mini i{display:block;height:100%;background:var(--ok)}
.bar-mini.full i{background:var(--gold)}

/* ---------- study ---------- */
.study-wrap{max-width:780px;margin:0 auto}
.study-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.prog{flex:1;min-width:160px;height:9px;background:#e9edf6;border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#7a5cf6);transition:width .35s}
.qcard{
  background:#fff;border-radius:22px;box-shadow:var(--shadow-lg);
  padding:26px 26px 22px;margin-bottom:14px;border-top:6px solid var(--brand);
}
.qmeta{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.qlabel{font-size:12.5px;color:var(--muted);font-weight:700;margin-bottom:8px}
.qtext{font-size:30px;font-weight:800;line-height:1.4;letter-spacing:.3px;word-break:break-word}
.qtext.small{font-size:21px}
.qtext.zh{font-size:24px;font-weight:700}
.qhint{margin-top:10px;font-size:13.5px;color:var(--ink2);background:#f7f9fd;border-radius:10px;padding:9px 12px;border-left:3px solid var(--brand)}
.speak{
  border:0;background:var(--brand-l);color:var(--brand-d);border-radius:10px;
  padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;margin-top:12px;font-family:inherit;
}
.speak:hover{background:#dde6ff}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{
  text-align:left;border:1.5px solid var(--line);background:#fbfcfe;border-radius:13px;
  padding:13px 16px;font-size:16px;font-weight:700;color:var(--ink);cursor:pointer;
  font-family:inherit;transition:.15s;display:flex;align-items:center;gap:10px;
}
.opt:hover{border-color:var(--brand);background:var(--brand-l)}
.opt .mk{width:26px;height:26px;border-radius:8px;background:#eceff6;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--ink2);flex:0 0 auto}
.opt.right{border-color:var(--ok);background:var(--ok-l)}
.opt.right .mk{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-l)}
.opt.wrong .mk{background:var(--bad);color:#fff}
.opt.locked{cursor:default}
.answer{margin-top:16px;border-radius:14px;padding:15px 17px;background:var(--ok-l);border-left:4px solid var(--ok);animation:fade .2s}
.answer .atag{font-size:12px;font-weight:800;color:#0d7d47;margin-bottom:5px}
.answer .atext{font-size:21px;font-weight:800;color:#0a5c37;line-height:1.5}
.answer .anote{font-size:13.5px;color:var(--ink2);margin-top:9px;line-height:1.7;white-space:pre-wrap}
.answer.miss{background:var(--bad-l);border-left-color:var(--bad)}
.answer.miss .atag{color:#b32834}
.answer.miss .atext{color:#a8232e}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
@media(max-width:560px){.actions{grid-template-columns:1fr}}
.checkline{display:flex;align-items:center;gap:9px;margin-top:14px;font-size:14px;color:var(--ink2);font-weight:600;cursor:pointer;user-select:none}
.checkline input{width:19px;height:19px;accent-color:var(--ok);cursor:pointer}
.hintbar{text-align:center;font-size:12.5px;color:var(--muted);margin-top:12px}
kbd{background:#f1f4f9;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;font-size:11.5px;font-family:ui-monospace,Consolas,monospace}

/* ---------- library ---------- */
.lib-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:#fcfdff;flex-wrap:wrap}
.lib-item .lt{flex:1;min-width:170px}
.lib-item .lt b{font-size:14.5px;display:block}
.lib-item .lt span{font-size:12px;color:var(--muted)}
.round-group{margin-bottom:16px}
.round-group h3{font-size:14px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty .big{font-size:44px;margin-bottom:8px}
.done-banner{background:linear-gradient(135deg,#e6f8ef,#e9f0ff);border:1.5px solid #bfe9d4;border-radius:16px;padding:18px;text-align:center;margin-bottom:14px}
.done-banner h3{margin:0 0 6px;font-size:17px}

/* ---------- stats ---------- */
.stat-row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.stat-row2{grid-template-columns:1fr}}
.hbar{margin-bottom:11px}
.hbar .hl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.hbar .ht{height:10px;background:#eceff6;border-radius:99px;overflow:hidden}
.hbar .ht i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#7a5cf6);border-radius:99px}
.hbar .ht i.done{background:linear-gradient(90deg,var(--ok),#63dba0)}
.kbd-list{font-size:13px;color:var(--ink2);line-height:1.9}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(20,28,46,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:18px}
.mask.on{display:flex}
.modal{background:#fff;border-radius:20px;max-width:680px;width:100%;max-height:86vh;overflow:auto;box-shadow:var(--shadow-lg);padding:24px}
.modal h3{margin:0 0 4px;font-size:18px}
.modal .close{position:sticky;top:0;float:right;border:0;background:#f1f4f9;border-radius:9px;width:32px;height:32px;font-size:16px;cursor:pointer;color:var(--ink2)}
.passage-en{font-size:15px;line-height:1.9;background:#f7f9fd;padding:14px;border-radius:12px;margin:10px 0}
.passage-zh{font-size:14.5px;line-height:1.9;color:var(--ink2)}
.pline{display:flex;gap:10px;margin-bottom:9px}
.pline .n{flex:0 0 26px;height:26px;border-radius:8px;background:var(--brand-l);color:var(--brand-d);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
  background:rgba(30,42,68,.94);color:#fff;padding:11px 20px;border-radius:12px;
  font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:200;
}
.toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-in">
    <div class="brand-row">
      <div class="logo">英</div>
      <div class="brand-txt">
        <h1>七年级英语上册 · 期中复习计划</h1>
        <p>人教版新教材 · Starter Unit 1 ~ Unit 3 · 单元知识清单（考点手册）</p>
      </div>
      <div class="head-right">
        <span class="pill" id="hPass">第 1 轮</span>
        <span class="pill gold" id="hStar">⭐ 0</span>
        <span class="pill red" id="hLib">复习库 0</span>
        <span class="pill green" id="hMastered">已掌握 0</span>
      </div>
    </div>
    <div class="mini-bar"><i id="hBar" style="width:0%"></i></div>
    <nav class="tabs">
      <button class="tab on" data-v="plan">📅 复习计划</button>
      <button class="tab" data-v="study">✏️ 开始复习</button>
      <button class="tab" data-v="lib">🗂 复习库 <span class="badge" id="tabLib">0</span></button>
      <button class="tab" data-v="stat">📊 掌握情况</button>
    </nav>
  </div>
</div>

<div class="app">
  <section class="view on" id="v-plan"></section>
  <section class="view" id="v-study"></section>
  <section class="view" id="v-lib"></section>
  <section class="view" id="v-stat"></section>
</div>

<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   1. 教材数据（人教版七年级上册 Starter Unit 1 ~ Unit 3）
   ============================================================ */
const CATS = [
  {k:'vocab',    name:'重点词汇',     icon:'🔤', type:'en2zh',  tip:'看英文，说出词性和中文意思'},
  {k:'phrase',   name:'重点短语',     icon:'🔗', type:'en2zh',  tip:'看短语，说出汉语意思'},
  {k:'sentence', name:'核心句型',     icon:'💬', type:'en2zh',  tip:'看句型，回忆对话的中文意思'},
  {k:'grammar',  name:'语法聚焦',     icon:'📐', type:'cloze',  tip:'补全考点中空缺的关键信息'},
  {k:'pitfall',  name:'易错提醒',     icon:'⚠️', type:'judge',  tip:'判断对错，再看原文提醒'},
  {k:'contrast', name:'词语辨析',     icon:'⚖️', type:'choice', tip:'选出正确用法，再看辨析原文'},
  {k:'form',     name:'词形变化',     icon:'🔄', type:'en2zh',  tip:'写出对应的复数或第三人称单数'},
  {k:'recite',   name:'重点句子背诵', icon:'🎤', type:'zh2en',  tip:'看中文，背出英文句子'},
  {k:'writing',  name:'主题作文范文', icon:'📝', type:'zh2en',  tip:'看中文，写出范文中的英文句'}
];

const UNITS = [
{
  id:'su1', name:'Starter Unit 1', title:'Hello!', topic:'问候与自我介绍', day:1,
  items:[
    {c:'vocab', q:'hello / hi', a:'int. 你好；喂'},
    {c:'vocab', q:'good', a:'adj. 好的'},
    {c:'vocab', q:'morning', a:'n. 早晨；上午'},
    {c:'vocab', q:'afternoon', a:'n. 下午'},
    {c:'vocab', q:'evening', a:'n. 晚上；傍晚'},
    {c:'vocab', q:'name', a:'n. 名字；名称'},
    {c:'vocab', q:'my', a:'pron. 我的'},
    {c:'vocab', q:'your', a:'pron. 你的；你们的'},
    {c:'vocab', q:'nice', a:'adj. 令人愉快的；好的'},
    {c:'vocab', q:'meet', a:'v. 遇见；相逢'},
    {c:'phrase', q:'good morning / afternoon / evening', a:'早上好／下午好／晚上好'},
    {c:'phrase', q:'nice to meet you', a:'很高兴见到你'},
    {c:'phrase', q:'what’s your name', a:'你叫什么名字'},
    {c:'sentence', q:'—What’s your name?  —My name is Wang Yaming. / —I’m Emma.', a:'—— 你叫什么名字？—— 我叫王阳明。/ 我叫埃玛。'},
    {c:'sentence', q:'—Nice to meet you.  —Nice to meet you, too.', a:'—— 很高兴见到你。—— 见到你我也很高兴。'},
    {c:'sentence', q:'Good morning, Ms Gao!', a:'高老师，早上好！'},
    {c:'grammar', q:'be 动词初识：I ___… / You ___… / He ___…（am / are / is）', a:'am；are；is', n:'be 动词初识：I am…/You are…/He is…，be 动词要跟着主语变化。'},
    {c:'grammar', q:'形容词性物主代词：my name、your name，后面要接 ___。', a:'名词', n:'形容词性物主代词 my name（我的名字）、your name（你的名字），后面接名词。'},
    {c:'pitfall', q:'判断正误：问句 “What’s your name” 末尾可以不用问号。', o:['正确','错误'], ok:1, n:'what’s 是 what is 的缩写；问句末尾要用问号。'},
    {c:'contrast', q:'晚上天黑后见面，应该说 ___。', o:['Good morning','Good afternoon','Good evening'], ok:2, n:'按一天中的时段选用：早上起床后到中午用 morning，午饭后到傍晚用 afternoon，天黑后见面用 evening。'},
    {c:'form', q:'name 的复数形式是？', a:'names', n:'name → names（复数）'},
    {c:'form', q:'friend 的复数形式是？', a:'friends', n:'friend → friends（复数）'},
    {c:'recite', q:'—— 你叫什么名字？—— 我叫李华。', a:'—What’s your name?  —My name is Li Hua.', n:'—What’s your name?  —My name is Li Hua. —— 你叫什么名字？—— 我叫李华。'},
    {c:'recite', q:'—— 很高兴见到你。—— 见到你我也很高兴。', a:'—Nice to meet you.  —Nice to meet you, too.', n:'—— 很高兴见到你。—— 见到你我也很高兴。'},
    {c:'recite', q:'高老师，早上好！', a:'Good morning, Ms Gao!', n:'Good morning, Ms Gao! —— 高老师，早上好！'}
  ]
},
{
  id:'su2', name:'Starter Unit 2', title:'Keep Tidy!', topic:'物品与颜色', day:1,
  items:[
    {c:'vocab', q:'tidy', a:'adj. 整洁的；整齐的'},
    {c:'vocab', q:'keep', a:'v. 保持；保留'},
    {c:'vocab', q:'pen', a:'n. 钢笔'},

/* ============================================================
   2. 状态与工具
   ============================================================ */
const CAT_MAP = {}; CATS.forEach(c=>CAT_MAP[c.k]=c);
const UNIT_MAP = {}; UNITS.forEach(u=>UNIT_MAP[u.id]=u);
const ALL = [];
UNITS.forEach(u=>{
  u.items.forEach((it,idx)=>{ it.id = u.id+'#'+idx; it.unit = u.id; ALL.push(it); });
  (WRITING_ITEMS[u.id]||[]).forEach((p,idx)=>{
    const it = {c:'writing', q:p[0], a:p[1], n:p[1], id:u.id+'#w'+idx, unit:u.id};
    u.items.push(it); ALL.push(it);
  });
});
const ITEM_MAP = {}; ALL.forEach(i=>ITEM_MAP[i.id]=i);

const KEY = 'eng_midterm_review_v1';
let state = load();

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const s = JSON.parse(raw);
      return Object.assign({mastered:{},lib:[],pass:1,history:{},recited:{},minutes:0,sessions:0}, s);
    }
  }catch(e){}
  return {mastered:{},lib:[],pass:1,history:{},recited:{},minutes:0,sessions:0};
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
/* 判断题 / 辨析题的答案就是正确选项 */
function answerText(it){ if(it.a) return it.a; if(it.o && it.o[it.ok]!=null) return it.o[it.ok]; return ''; }
function noteText(it){ if(!it.n) return ''; if(it.n===it.a) return ''; return it.n; }
function unitLabel(id){ const u=UNIT_MAP[id]; return u? u.name+' '+u.title : id; }
function catName(k){ return CAT_MAP[k]? CAT_MAP[k].name : k; }
function masteredCount(list){ return list.filter(i=>state.mastered[i.id]).length; }
function totalItems(){ return ALL.length; }

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('on');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),1800);
}
function speak(text){
  try{
    if(!window.speechSynthesis) return toast('当前浏览器不支持朗读');
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text.replace(/[—–]/g,' '));
    u.lang='en-US'; u.rate=0.85;
    window.speechSynthesis.speak(u);
  }catch(e){ toast('朗读失败'); }
}
function modal(html){
  const m=document.getElementById('modal');
  m.innerHTML='<button class="close" onclick="closeModal()">✕</button>'+html;
  document.getElementById('mask').classList.add('on');
}
function closeModal(){ document.getElementById('mask').classList.remove('on'); }
document.getElementById('mask').addEventListener('click',function(e){ if(e.target===this) closeModal(); });

function renderPlan(){
  const total=totalItems(), done=masteredCount(ALL), pct=Math.round(done/total*100);
  const libN=state.lib.length;
  const pending=total-done;

  // 今日建议：第一个未完成的计划日
  let advice=null;
  for(const d of PLAN_DAYS){
    if(d.units.length){
      const items=UNITS.filter(u=>d.units.includes(u.id)).flatMap(u=>u.items);
      if(masteredCount(items)<items.length){ advice={day:d,items:items,got:masteredCount(items)}; break; }
    }else if(libN>0){ advice={day:d,items:[],got:0}; break; }
  }

  const R=64, C=2*Math.PI*R;
  let html='';

  html+='<div class="card"><h2>📅 复习进度总览</h2><p class="sub">人教版七年级上册 · 范围 Starter Unit 1 ~ Unit 3 · 共 '+UNITS.length+' 个单元 / '+CATS.length+' 个考点分类 / '+total+' 个知识点</p>';
  html+='<div class="dash"><div class="ring"><svg width="132" height="132">'
    + '<circle cx="66" cy="66" r="'+R+'" fill="none" stroke="#eceff6" stroke-width="12"/>'
    + '<circle cx="66" cy="66" r="'+R+'" fill="none" stroke="url(#g1)" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-pct/100))+'"/>'
    + '<defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#4f7cff"/><stop offset="100%" stop-color="#7a5cf6"/></linearGradient></defs>'
    + '</svg><div class="mid"><b>'+pct+'%</b><span>已掌握</span></div></div>';
  html+='<div><div class="stat-row">'
    +'<div class="stat"><b>'+done+'</b><span>已掌握知识点</span></div>'
    +'<div class="stat"><b>'+pending+'</b><span>尚未掌握</span></div>'
    +'<div class="stat"><b>'+libN+'</b><span>复习库待复习</span></div>'
    +'<div class="stat"><b>'+state.pass+'</b><span>当前轮次</span></div>'
    +'<div class="stat"><b>'+Math.floor(state.minutes)+'</b><span>累计学习(分钟)</span></div>'
    +'<div class="stat"><b>'+Math.floor(done/10)+'</b><span>获得星星</span></div>'
    +'</div>';
  if(advice){
    html+='<div style="margin-top:14px;background:#f7f9fd;border-radius:14px;padding:13px 15px">'
      +'<div style="font-weight:800;margin-bottom:4px">🎯 建议今天：'+advice.day.title+'</div>'
      +'<div style="font-size:13px;color:var(--ink2);margin-bottom:10px">'+advice.day.tip+'</div>'
      +'<div style="display:flex;gap:8px;flex-wrap:wrap">'
      + (advice.day.units.length
          ? '<button class="btn primary" onclick="startSession({mode:\'plan\',units:['+advice.day.units.map(u=>'\''+u+'\'').join(',')+']})">开始今日计划</button>'
          : '<button class="btn primary" onclick="startSession({mode:\'library\'})">开始复习库第 '+(state.pass+1)+' 轮</button>')
      + '<button class="btn ghost" onclick="switchTab(\'study\')">自由选择练习</button></div></div>';
  }
  html+='</div></div></div>';

  // 计划表
  html+='<div class="card"><h2>🗓️ 六天复习计划</h2><p class="sub">第 1—3 天按单元推进，第 4—6 天专门攻克自己在复习库里选的知识点</p>';
  for(const d of PLAN_DAYS){
    let items=[];
    if(d.units.length) items=UNITS.filter(u=>d.units.includes(u.id)).flatMap(u=>u.items);
    const got=items.length? masteredCount(items):0;
    const pctD=items.length? Math.round(got/items.length*100): (libN?0:100);
    const doneD = items.length? got===items.length : (state.pass>1 && libN===0);
    html+='<div class="day'+(doneD?' done':'')+'"><div class="dtop"><span class="chip r">DAY '+d.n+'</span>'
      +'<span class="dname">'+d.title+'</span>'
      +'<span class="chip '+(doneD?'g':'u')+'">'+(doneD?'已完成':(items.length? got+' / '+items.length+' 已掌握': (libN? libN+' 个待复习':'暂无任务')))+'</span>'
      +'</div>';
    html+='<div class="dtip">'+d.tip+'</div>';
    if(items.length){
      html+='<div class="unit-pills">';
      for(const uid of d.units){ const u=UNIT_MAP[uid]; const its=u.items; html+='<span class="chip u">'+u.name+' · '+u.title+'（'+u.items.length+' 点）</span>'; }
      html+='</div>';
    }
    html+='<div class="dacts">';
    if(d.units.length){
      html+='<button class="btn primary sm" onclick="startSession({mode:\'plan\',units:['+d.units.map(u=>'\''+u+'\'').join(',')+']})">开始这一天的内容</button>';
      html+='<button class="btn ghost sm" onclick="startSession({mode:\'plan\',units:['+d.units.map(u=>'\''+u+'\'').join(',')+'],onlyUnmastered:true})">只练没掌握的</button>';
    }else{
      html+='<button class="btn primary sm" onclick="startSession({mode:\'library\'})">复习复习库（'+libN+' 个）</button>';
    }
    html+='</div></div>';
  }
  html+='</div>';

  // 分类矩阵
  html+='<div class="card"><h2>🧩 单元 × 考点分类 掌握矩阵</h2><p class="sub">点击任意格子，直接开始该分类的专项练习</p><div class="tbl-wrap"><table><thead><tr><th>单元</th>';
  for(const c of CATS) html+='<th>'+c.icon+' '+c.name+'</th>';
  html+='<th>合计</th></tr></thead><tbody>';
  for(const u of UNITS){
    html+='<tr><td>'+u.name+' '+u.title+'<div class="cnt">'+u.topic+'</div></td>';
    let ut=0, ud=0;
    for(const c of CATS){
      const its=u.items.filter(i=>i.c===c.k);
      const got=masteredCount(its);
      ut+=its.length; ud+=got;
      const p=its.length?Math.round(got/its.length*100):0;
      html+='<td class="cell" onclick="startSession({mode:\'cat\',unit:\''+u.id+'\',cat:\''+c.k+'\'})">'
        + (its.length? '<b>'+got+'</b>/'+its.length+'<span class="cnt">'+c.name+'</span><div class="bar-mini'+(p===100?' full':'')+'"><i style="width:'+p+'%"></i></div>' : '<span class="cnt" style="opacity:.35">—</span>')
        +'</td>';
    }
    html+='<td><b>'+ud+'</b>/'+ut+'</td></tr>';
  }
  html+='<tr style="background:#f7f9fd"><td><b>合计</b></td>';
  for(const c of CATS){
    const its=ALL.filter(i=>i.c===c.k), got=masteredCount(its);
    html+='<td><b>'+got+'</b>/'+its.length+'</td>';
  }
  html+='<td><b>'+masteredCount(ALL)+'</b>/'+total+'</td></tr>';
  html+='</tbody></table></div>';
  html+='<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">'
    +'<button class="btn primary" onclick="startSession({mode:\'all\'})">🚀 全量第一轮复习（'+total+' 个知识点）</button>'
    +'<button class="btn accent" onclick="startSession({mode:\'library\'})">🗂 复习复习库（'+libN+' 个）</button>'
    +'<button class="btn ghost" onclick="resetAll()">重置全部进度</button></div></div>';

  document.getElementById('v-plan').innerHTML=html;
}

function resetAll(){
  modal('<h3>确认重置？</h3><p class="sub">所有掌握记录、复习库和学习时长都会清空，回到第一轮全量复习。</p>'
    +'<div style="display:flex;gap:10px;margin-top:14px"><button class="btn ghost" onclick="closeModal()">取消</button>'
    +'<button class="btn" style="background:#ef4d5a;color:#fff" onclick="doReset()">确认重置</button></div>');
}
function doReset(){
  state={mastered:{},lib:[],pass:1,history:{},recited:{},minutes:0,sessions:0};
  save(); renderAll(); closeModal(); toast('已重置，可以重新开始第一轮');
}

   ============================================================ */
function renderLib(){
  const lib=state.lib;
  let html='';
  if(!lib.length){
    html+='<div class="card"><div class="done-banner"><div style="font-size:40px">🎉</div><h3>复习库是空的</h3>'
      +'<p style="margin:0;color:var(--ink2);font-size:13.5px">全部知识点都已掌握！每遇到不会的，点「加入再次复习」，它就会自动进入这里等待下一轮。</p></div>'
      +'<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">'
      +'<button class="btn primary" onclick="startSession({mode:\'all\'})">重新全量复习一遍</button>'
      +'<button class="btn ghost" onclick="switchTab(\'plan\')">回到复习计划</button></div></div>';
  }else{
    html+='<div class="card"><h2>🗂 我的复习库</h2><p class="sub">这些是你自己选择「加入再次复习」的知识点。每一轮都会把复习库全部过一遍（先复习到期最久的），直到全部掌握为止。</p>'
      +'<div class="stat-row">'
      +'<div class="stat"><b>'+lib.length+'</b><span>待复习知识点</span></div>'
      +'<div class="stat"><b>'+state.pass+'</b><span>已完成轮次</span></div>'
      +'<div class="stat"><b>'+lib.filter(x=>x.times>=3).length+'</b><span>顽固点(≥3次)</span></div></div>'
      +'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">'
      +'<button class="btn primary big" onclick="startSession({mode:\'library\'})">开始第 '+(state.pass+1)+' 轮复习（'+lib.length+' 个）</button>'
      +'<button class="btn ghost" onclick="startSession({mode:\'library\',allPending:true})">按加入顺序全部再练一遍</button>'
      +'<button class="btn ghost" onclick="clearLib()">清空复习库</button></div></div>';

    const rounds={};
    lib.forEach(x=>{ const k=x.stage||2; (rounds[k]=rounds[k]||[]).push(x); });
    Object.keys(rounds).sort((a,b)=>a-b).forEach(st=>{
      const arr=rounds[st];
      html+='<div class="card"><div class="round-group"><h3><span class="chip r">第 '+st+' 轮到</span> '+arr.length+' 个知识点（下一轮优先复习）</h3>';
      arr.forEach(x=>{
        const it=ITEM_MAP[x.id]; if(!it) return;
        html+='<div class="lib-item"><div class="lt"><b>'+esc(it.q)+'</b><span>'+unitLabel(it.unit)+' · '+catName(it.c)+' · 已复习 '+(x.times||1)+' 次</span></div>'
          +'<button class="btn sm ghost" onclick="showItem(\''+it.id+'\')">查看</button>'
          +'<button class="btn sm ok" onclick="masterNow(\''+it.id+'\')">✓ 已掌握</button>'
          +'<button class="btn sm ghost" onclick="requeue(\''+it.id+'\')">↻ 排到下轮</button></div>';
      });
      html+='</div></div>';
    });
  }
  document.getElementById('v-lib').innerHTML=html;
}
function clearLib(){
  modal('<h3>清空复习库？</h3><p class="sub">这些知识点将不再进入后续复习轮次，但已掌握记录会保留。</p>'
    +'<div style="display:flex;gap:10px;margin-top:14px"><button class="btn ghost" onclick="closeModal()">取消</button>'
    +'<button class="btn" style="background:#ef4d5a;color:#fff" onclick="doClearLib()">确认清空</button></div>');
}
function doClearLib(){ state.lib=[]; save(); renderAll(); closeModal(); toast('复习库已清空'); }
function masterNow(id){
  state.mastered[id]=true;
  state.lib=state.lib.filter(x=>x.id!==id);
  save(); renderAll(); toast('已标记为掌握 ⭐');
}
function requeue(id){
  const x=state.lib.find(v=>v.id===id);
  if(x){ x.stage=state.pass+1; x.times=(x.times||1)+1; save(); renderAll(); toast('已排到第 '+(state.pass+1)+' 轮'); }
}
function showItem(id){
  const it=ITEM_MAP[id]; if(!it) return;
  modal('<h3>'+esc(catName(it.c))+' · '+esc(unitLabel(it.unit))+'</h3>'
    +'<div class="qtext small" style="margin:10px 0">'+esc(it.q)+'</div>'
    +'<div class="answer"><div class="atag">答案</div><div class="atext">'+esc(answerText(it))+'</div>'
    + (noteText(it)?'<div class="anote">'+esc(noteText(it))+'</div>':'')+'</div>');
}

/* ============================================================
   6. 复习会话
   ============================================================ */
let session=null;

function startSession(opt){
  opt=opt||{};
  let items=[], pass=state.pass, title='', mode=opt.mode;

  if(mode==='library'){
    pass=state.pass+1;
    /* 复习库每轮全部过一遍，先复习到期最久的（stage 小的优先），保证不会漏掉任何一个点 */
    let q=state.lib.slice().sort(function(a,b){
      if(opt.allPending) return (a.at||0)-(b.at||0);
      return (a.stage||2)-(b.stage||2) || (a.at||0)-(b.at||0);
    });
    items=q.map(x=>ITEM_MAP[x.id]).filter(Boolean);
    title='第 '+pass+' 轮复习（复习库 '+items.length+' 个）';
  }else{
    pass=state.pass;
    if(mode==='all'){ items=ALL.slice(); title='全量复习'; }
    else if(mode==='plan'){ items=UNITS.filter(u=>opt.units.includes(u.id)).flatMap(u=>u.items); title=opt.units.map(unitLabel).join(' + '); }
    else if(mode==='unit'){ items=UNIT_MAP[opt.unit].items.slice(); title=unitLabel(opt.unit); }
    else if(mode==='cat'){ items=UNIT_MAP[opt.unit].items.filter(i=>i.c===opt.cat); title=unitLabel(opt.unit)+' · '+catName(opt.cat); }
    if(opt.onlyUnmastered) items=items.filter(i=>!state.mastered[i.id]);
  }

  if(!items.length){ toast('这里没有需要复习的内容'); return; }

  // 打乱顺序（库复习时保留难度层次感，打乱即可）
  items=items.slice();
  if(mode!=='cat') items=shuffle(items);

  session={items:items, idx:0, pass:pass, mode:mode, title:title, revealed:false, picked:null, correct:null,
           stats:{ok:0,again:0}, startTime:Date.now(), wrongIds:[]};
  switchTab('study');
  renderStudy();
}

function shuffle(a){
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}

function currentItem(){ return session? session.items[session.idx] : null; }

function renderStudy(){
  const el=document.getElementById('v-study');
  if(!session){
    el.innerHTML='<div class="card"><div class="empty"><div class="big">✏️</div><p>还没有开始复习。回到「复习计划」选择要练的内容，或直接开始全量第一轮。</p>'
      +'<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">'
      +'<button class="btn primary" onclick="startSession({mode:\'all\'})">开始全量第一轮</button>'
      +'<button class="btn accent" onclick="startSession({mode:\'library\'})">复习复习库（'+state.lib.length+'）</button>'
      +'<button class="btn ghost" onclick="switchTab(\'plan\')">复习计划</button></div></div></div>';
    return;
  }
  const it=currentItem();
  const total=session.items.length, no=session.idx+1;
  const cat=CAT_MAP[it.c];
  const isChoice=(it.o&&it.o.length);
  const zhType=(cat.type==='zh2en');

  let qlabel='';
  if(cat.type==='en2zh') qlabel = (it.c==='vocab'?'看英文，说出词性和中文意思':(it.c==='form'?'写出对应的变化形式':'看英文，说出汉语意思'));
  else if(cat.type==='zh2en') qlabel = '看中文，说出对应的英文';
  else if(cat.type==='cloze') qlabel = '补全考点中的关键信息';
  else if(cat.type==='judge') qlabel = '判断正误';
  else if(cat.type==='choice') qlabel = '选出正确的一项';

  let html='<div class="study-wrap">';
  html+='<div class="study-top">'
    +'<span class="chip r">'+esc(session.title)+'</span>'
    +'<span class="chip u">第 '+session.pass+' 轮</span>'
    +'<span class="chip g">'+no+' / '+total+'</span>'
    +'<div class="prog"><i style="width:'+Math.round(session.idx/total*100)+'%"></i></div>'
    +'<button class="btn sm ghost" onclick="quitSession()">退出</button></div>';

  html+='<div class="qcard"><div class="qmeta">'
    +'<span class="chip u">'+esc(unitLabel(it.unit))+'</span>'
    +'<span class="chip c">'+cat.icon+' '+cat.name+'</span>'
    +(it.c==='writing'? '<span class="chip g">📄 范文：'+esc((PASSAGES[it.unit]||{}).title||'')+'</span>':'')
    +'</div>';
  html+='<div class="qlabel">'+qlabel+'</div>';
  html+='<div class="qtext '+(zhType?'zh':(it.q.length>40?'small':''))+'">'+esc(it.q)+'</div>';

  if(cat.type==='en2zh' && /[A-Za-z]/.test(it.q)){
    html+='<button class="speak" onclick="speak(\''+jsq(it.q)+'\')">🔊 朗读英文</button>';
  }
  if(it.c==='writing'){
    html+='<button class="speak" onclick="showPassage(\''+it.unit+'\')">📄 看范文全文</button>';
  }

  if(isChoice){
    html+='<div class="opts">';
    it.o.forEach((o,i)=>{
      let cls='opt';
      if(session.revealed){
        cls+=' locked';
        if(i===it.ok) cls+=' right';
        else if(i===session.picked) cls+=' wrong';
      }
      html+='<button class="'+cls+'" onclick="pick('+i+')"><span class="mk">'+String.fromCharCode(65+i)+'</span><span>'+esc(o)+'</span></button>';
    });
    html+='</div>';
  }

  if(!session.revealed && !isChoice){
    html+='<div style="margin-top:18px"><button class="btn primary big" style="width:100%" onclick="reveal()">👀 显示答案</button></div>';
  }
  if(!session.revealed && isChoice){
    html+='<div style="margin-top:14px;font-size:13px;color:var(--muted);text-align:center">先选一个答案，系统会告诉你对不对</div>';
  }

  if(session.revealed){
    const miss=(session.correct===false);
    html+='<div class="answer'+(miss?' miss':'')+'"><div class="atag">'+(miss?'❌ 答错了':'✅ 正确答案')+'</div>'
      +'<div class="atext">'+esc(answerText(it))+'</div>'
      +(noteText(it)?'<div class="anote">'+esc(noteText(it))+'</div>':'')+'</div>';
    if(zhType && /[A-Za-z]/.test(it.a||'')){
      html+='<button class="speak" onclick="speak(\''+jsq(it.a)+'\')">🔊 朗读英文答案</button>';
    }
    if(it.c==='recite'||it.c==='writing'){
      const on=!!state.recited[it.id];
      html+='<label class="checkline"><input type="checkbox" '+(on?'checked':'')+' onchange="markRecited(\''+it.id+'\',this.checked)"> 我已经能背诵这一句了</label>';
    }
    html+='<div class="actions">'
      +'<button class="btn ok big" onclick="mark(\'ok\')">✓ 记住了</button>'
      +'<button class="btn accent big" onclick="mark(\'again\')">↺ 加入再次复习</button></div>';
  }
  html+='</div>';

  html+='<div class="hintbar">快捷键：<kbd>空格</kbd> 显示答案 · <kbd>1</kbd> 记住了 · <kbd>2</kbd> 加入再次复习 · <kbd>Enter</kbd> 下一题 · <kbd>A</kbd> 全量复习 · <kbd>L</kbd> 复习库 · <kbd>P</kbd> 计划 · <kbd>V</kbd> 统计</div>';
  html+='</div>';
  el.innerHTML=html;
}
function jsq(s){ return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

function reveal(){
  if(!session||session.revealed) return;
  session.revealed=true; renderStudy();
}
function pick(i){
  if(!session||session.revealed) return;
  const it=currentItem();
  session.picked=i;
  session.correct=(i===it.ok);
  session.revealed=true;
  if(!session.correct) session.wrongIds.push(it.id);
  renderStudy();
}
function markRecited(id,on){ state.recited[id]=on; save(); }

function mark(kind){
  if(!session||!session.revealed) return;
  const it=currentItem();
  if(kind==='ok'){
    state.mastered[it.id]=true;
    state.lib=state.lib.filter(x=>x.id!==it.id);
    session.stats.ok++;
    recordHistory(it.id,true);
    toast('👍 已掌握，真棒！');
  }else{
    state.mastered[it.id]=false;
    delete state.mastered[it.id];
    const stage=session.pass+1;
    const ex=state.lib.find(x=>x.id===it.id);
    if(ex){ ex.stage=stage; ex.times=(ex.times||1)+1; }
    else state.lib.push({id:it.id, stage:stage, times:1, at:Date.now()});
    session.stats.again++;
    recordHistory(it.id,false);
    toast('📌 已放进复习库，第 '+stage+' 轮再见');
  }
  save(); renderHead(); renderLib();
  next();
}
function recordHistory(id,ok){
  state.history[id]=state.history[id]||{n:0,ok:0};
  state.history[id].n++; if(ok) state.history[id].ok++;
}
function next(){
  if(!session) return;
  session.idx++; session.revealed=false; session.picked=null; session.correct=null;
  if(session.idx>=session.items.length) finishSession();
  else { renderHead(); renderStudy(); }
}
function quitSession(){
  const done=session.idx;
  modal('<h3>退出本轮练习？</h3><p class="sub">已完成 '+done+' 题，进度会自动保存（已加入复习库的知识点不会丢失）。</p>'
    +'<div style="display:flex;gap:10px;margin-top:14px"><button class="btn ghost" onclick="closeModal()">继续练习</button>'
    +'<button class="btn primary" onclick="doQuit()">退出</button></div>');
}
function doQuit(){
  const mins=(Date.now()-session.startTime)/60000;
  state.minutes+=mins; state.sessions++;
  session=null; save(); closeModal(); renderAll(); switchTab('plan');
}
function finishSession(){
  const mins=(Date.now()-session.startTime)/60000;
  state.minutes+=mins; state.sessions++;
  if(session.mode==='library') state.pass=Math.max(state.pass, session.pass);
  else if(session.pass>state.pass) state.pass=session.pass;
  save();

  const s=session.stats, libN=state.lib.length;
  let msg='';
  if(libN===0){
    msg='<div class="done-banner"><div style="font-size:42px">🎉</div><h3>复习完成！复习库已清空</h3>'
      +'<p style="margin:0;color:var(--ink2);font-size:13.5px">所有知识点你都标记为「记住了」，这一轮没有留下待复习项。</p></div>';
  }else{
    msg='<div style="background:#fff4dc;border-radius:14px;padding:13px 15px;margin-bottom:12px">'
      +'<b>📌 还有 '+libN+' 个知识点在复习库里</b><div style="font-size:13px;color:var(--ink2);margin-top:4px">下一轮（第 '+(state.pass+1)+' 轮）将只针对你自己选择的这些知识点进行，直到全部掌握为止。</div></div>';
  }
  modal('<h3>本轮完成 ✅</h3>'
    +'<p class="sub">'+esc(session.title)+' · 用时 '+Math.max(1,Math.round(mins))+' 分钟</p>'
    +'<div class="stat-row">'
    +'<div class="stat"><b>'+(s.ok+s.again)+'</b><span>本轮题数</span></div>'
    +'<div class="stat"><b>'+s.ok+'</b><span>记住了</span></div>'
    +'<div class="stat"><b>'+s.again+'</b><span>加入复习库</span></div>'
    +'<div class="stat"><b>'+libN+'</b><span>复习库剩余</span></div></div>'
    +msg
    +'<div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap">'
    +(libN? '<button class="btn primary big" onclick="closeModal();startSession({mode:\'library\'})">开始第 '+(state.pass+1)+' 轮（'+libN+' 个）</button>'
            +'<button class="btn ghost" onclick="closeModal();switchTab(\'lib\')">查看复习库</button>'
          : '<button class="btn primary big" onclick="closeModal();switchTab(\'stat\')">查看掌握情况</button>')
    +'<button class="btn ghost" onclick="closeModal();switchTab(\'plan\')">返回计划</button></div>');
  session=null; renderAll();
}

function showPassage(uid){
  const p=PASSAGES[uid]; if(!p) return;
  let en='',zh='';
  p.en.forEach((l,i)=>{ en+='<div class="pline"><span class="n">'+(i+1)+'</span><span>'+esc(l)+'</span></div>'; });
  p.zh.forEach((l,i)=>{ zh+='<div class="pline"><span class="n">'+(i+1)+'</span><span>'+esc(l)+'</span></div>'; });
  modal('<h3>'+esc(p.title)+'</h3><p class="sub">先读英文范文，再对照中文译文。</p>'
    +'<div class="passage-en">'+en+'</div>'
    +'<div style="font-weight:800;font-size:13px;color:var(--muted);margin-top:12px">中文译文</div>'
    +'<div class="passage-zh" style="margin-top:6px">'+zh+'</div>');
}

/* ============================================================
   7. 导航与快捷键
   ============================================================ */
function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on', t.dataset.v===name));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on', v.id==='v-'+name));
  if(name==='study') renderStudy();
  window.scrollTo({top:0,behavior:'smooth'});
}
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>switchTab(t.dataset.v));
});

document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const studyOn=document.getElementById('v-study').classList.contains('on');

  /* 全局快捷键 */
  if(!studyOn){
    const k=e.key.toLowerCase();
    if(k==='a'){ e.preventDefault(); startSession({mode:'all'}); }
    else if(k==='l'){ e.preventDefault(); startSession({mode:'library'}); }
    else if(k==='p'){ e.preventDefault(); switchTab('plan'); }
    else if(k==='v'){ e.preventDefault(); switchTab('stat'); }
    return;
  }

  if(!session) return;
  const it=currentItem(); if(!it) return;
  if(e.code==='Space'){ e.preventDefault(); if(!session.revealed) reveal(); }
  else if(e.key==='1'){ if(session.revealed) mark('ok'); }
  else if(e.key==='2'){ if(session.revealed) mark('again'); }
  else if(e.key==='Enter'){ if(session.revealed) next(); else reveal(); }
});

/* ============================================================
   8. 顶部状态 & 初始化
   ============================================================ */
function renderHead(){
  const total=totalItems(), done=masteredCount(ALL);
  document.getElementById('hPass').textContent='第 '+state.pass+' 轮';
  document.getElementById('hStar').textContent='⭐ '+Math.floor(done/10);
  document.getElementById('hLib').textContent='复习库 '+state.lib.length;
  document.getElementById('hMastered').textContent='已掌握 '+done;
  document.getElementById('tabLib').textContent=state.lib.length;
  document.getElementById('hBar').style.width=(total? Math.round(done/total*100):0)+'%';
}
function renderAll(){
  renderHead(); renderPlan(); renderLib(); renderStat();
  if(session) renderStudy();
}
renderAll();
</script>
